# generated by otel2lm render from before.yaml
receivers:
  loki:
    protocols:
      http:
        endpoint: "0.0.0.0:3500"
    use_incoming_timestamp: true
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
        cors:
          allowed_origins:
          - "http://localhost:8080"
          - "http://127.0.0.1:8080"
          - "http://host.docker.internal:8080"
          - "http://0.0.0.0:8080"
          - "https://drunkenvibecoding.com"
          - "https://www.drunkenvibecoding.com"
          - "https://awlrightleathers.com"
          - "https://www.awlrightleathers.com"
          allowed_headers:
          - Content-Type
          - X-Requested-With
          - traceparent
          - tracestate
          - baggage
          max_age: 7200
      grpc:
        endpoint: "0.0.0.0:4317"
processors:
  batch: {}
  batch/logs:
    send_batch_size: 200
    send_batch_max_size: 200
    timeout: 2s
  transform/dockerlogs:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - "set(attributes[\"service.name\"], attributes[\"container\"]) where attributes[\"container\"] != nil and attributes[\"service.name\"] == nil"
      - "set(attributes[\"service.name\"], attributes[\"app\"]) where attributes[\"app\"] != nil and attributes[\"service.name\"] == nil"
      - "set(attributes[\"trace_id\"], trace_id.string) where trace_id.string != \"00000000000000000000000000000000\""
      - "set(attributes[\"span_id\"], span_id.string) where span_id.string != \"0000000000000000\""
      - "set(attributes[\"trace_id\"], ParseJSON(body)[\"trace_id\"]) where attributes[\"trace_id\"] == nil and IsString(body) and IsMatch(body, \"\\\"trace_id\\\"\\\\s*:\\\\s*\\\"[0-9a-fA-F]{32}\\\"\")"
      - "set(attributes[\"span_id\"], ParseJSON(body)[\"span_id\"]) where attributes[\"span_id\"] == nil and IsString(body) and IsMatch(body, \"\\\"span_id\\\"\\\\s*:\\\\s*\\\"[0-9a-fA-F]{16}\\\"\")"
  transform/lm_entity:
    error_mode: ignore
    trace_statements:
    - context: resource
      statements:
      - "set(attributes[\"container.id\"], attributes[\"host.name\"]) where attributes[\"container.id\"] == nil and attributes[\"host.name\"] != nil and IsMatch(attributes[\"host.name\"], \"^[0-9a-f]{12}$\"\
        )"
      - "set(attributes[\"lm.entity\"], \"chip-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^chip-web(-browser|-rum)?$)\")"
      - "set(attributes[\"lm.entity\"], \"awlright-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^(awlright-leathers|awlright-web-rum)$)\")"
      - "set(attributes[\"lm.entity\"], \"awlright-admin\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^awlright-admin$)\")"
      - "set(attributes[\"lm.entity\"], \"vdvlabs-web-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vdvlabs-web(-browser|-rum)?$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-api-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-api$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-janitor-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-janitor$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-app-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-web$)\")"
      - "set(attributes[\"lm.entity\"], \"dvc-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^dvc-web-rum$)\")"
      - "set(attributes[\"lm.entity\"], \"nas\") where attributes[\"lm.entity\"] == nil"
      - "set(attributes[\"host.name\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"system.hostname\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"system.displayname\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"resource.type\"], \"host\")"
      - "set(attributes[\"deployment.environment.name\"], attributes[\"deployment.environment\"]) where attributes[\"deployment.environment.name\"] == nil and attributes[\"deployment.environment\"] != nil"
      - "delete_key(attributes, \"lm.entity\")"
    metric_statements:
    - context: resource
      statements:
      - "set(attributes[\"container.id\"], attributes[\"host.name\"]) where attributes[\"container.id\"] == nil and attributes[\"host.name\"] != nil and IsMatch(attributes[\"host.name\"], \"^[0-9a-f]{12}$\"\
        )"
      - "set(attributes[\"lm.entity\"], \"chip-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^chip-web(-browser|-rum)?$)\")"
      - "set(attributes[\"lm.entity\"], \"awlright-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^(awlright-leathers|awlright-web-rum)$)\")"
      - "set(attributes[\"lm.entity\"], \"awlright-admin\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^awlright-admin$)\")"
      - "set(attributes[\"lm.entity\"], \"vdvlabs-web-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vdvlabs-web(-browser|-rum)?$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-api-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-api$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-janitor-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-janitor$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-app-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-web$)\")"
      - "set(attributes[\"lm.entity\"], \"dvc-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^dvc-web-rum$)\")"
      - "set(attributes[\"lm.entity\"], \"nas\") where attributes[\"lm.entity\"] == nil"
      - "set(attributes[\"host.name\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"system.hostname\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"system.displayname\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"resource.type\"], \"host\")"
      - "set(attributes[\"deployment.environment.name\"], attributes[\"deployment.environment\"]) where attributes[\"deployment.environment.name\"] == nil and attributes[\"deployment.environment\"] != nil"
      - "delete_key(attributes, \"lm.entity\")"
  transform/lm_logs:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - "set(attributes[\"trace_id\"], trace_id.string) where trace_id.string != \"00000000000000000000000000000000\""
      - "set(attributes[\"span_id\"], span_id.string) where span_id.string != \"0000000000000000\""
      - "set(resource.attributes[\"lm.entity\"], \"chip-web\") where attributes[\"container\"] == \"chip-web\""
      - "set(resource.attributes[\"lm.entity\"], \"awlright-web\") where attributes[\"container\"] == \"awlright-web\""
      - "set(resource.attributes[\"lm.entity\"], \"awlright-admin\") where attributes[\"container\"] == \"awlright-admin\""
      - "set(resource.attributes[\"lm.entity\"], \"vdvlabs-web-1\") where attributes[\"container\"] == \"vdvlabs-web-1\""
      - "set(resource.attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-api-1\") where attributes[\"container\"] == \"vectorstudio-vectorstudio-api-1\""
      - "set(resource.attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-janitor-1\") where attributes[\"container\"] == \"vectorstudio-vectorstudio-janitor-1\""
      - "set(resource.attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-app-1\") where attributes[\"container\"] == \"vectorstudio-vectorstudio-app-1\""
      - "set(resource.attributes[\"lm.entity\"], \"dvc-web\") where attributes[\"container\"] == \"dvc-web\""
    - context: resource
      statements:
      - "set(attributes[\"lm.entity\"], \"chip-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^chip-web(-browser|-rum)?$)\")"
      - "set(attributes[\"lm.entity\"], \"awlright-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^(awlright-leathers|awlright-web-rum)$)\")"
      - "set(attributes[\"lm.entity\"], \"awlright-admin\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^awlright-admin$)\")"
      - "set(attributes[\"lm.entity\"], \"vdvlabs-web-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vdvlabs-web(-browser|-rum)?$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-api-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-api$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-janitor-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-janitor$)\")"
      - "set(attributes[\"lm.entity\"], \"vectorstudio-vectorstudio-app-1\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^vectorstudio-web$)\")"
      - "set(attributes[\"lm.entity\"], \"dvc-web\") where attributes[\"lm.entity\"] == nil and IsMatch(attributes[\"service.name\"], \"(?:^dvc-web-rum$)\")"
      - "set(attributes[\"lm.entity\"], \"nas\") where attributes[\"lm.entity\"] == nil"
      - "set(attributes[\"system.hostname\"], attributes[\"lm.entity\"])"
      - "set(attributes[\"host.name\"], attributes[\"lm.entity\"])"
      - "delete_key(attributes, \"lm.entity\")"
      - "delete_key(attributes, \"system.collectorid\")"
  batch/lm:
    send_batch_size: 300
    send_batch_max_size: 300
    timeout: 5s
connectors:
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets:
        - 5ms
        - 10ms
        - 25ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 1.5s
        - 2s
        - 2.5s
        - 4s
        - 5s
        - 10s
        - 30s
        - 60s
        - 2m
        - 5m
    dimensions:
    - name: rum.route
    - name: rum.country
    - name: rum.region
    - name: rum.referrer
    - name: rum.section
    - name: rum.cta
    - name: rum.episode
    - name: rum.vital.name
    - name: rum.vital.rating
    - name: rum.error.message
    - name: session.id
    dimensions_cache_size: 5000
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 15s
    exemplars:
      enabled: false
  spanmetrics/lm:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets:
        - 10ms
        - 50ms
        - 100ms
        - 250ms
        - 500ms
        - 1s
        - 2.5s
        - 5s
        - 10s
        - 30s
    dimensions:
    - name: http.request.method
    - name: http.response.status_code
    - name: rum.route
    - name: rum.country
    - name: rum.section
    - name: rum.cta
    - name: rum.vital.name
    - name: rum.vital.rating
    dimensions_cache_size: 2000
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 60s
exporters:
  otlphttp/tempo:
    endpoint: "http://tempo:4318"
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:9464"
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic
  logicmonitor:
    endpoint: "https://lmrobert.logicmonitor.com/rest"
    api_token:
      access_id: "${env:LOGICMONITOR_ACCESS_ID}"
      access_key: "${env:LOGICMONITOR_ACCESS_KEY}"
    logs:
      resource_mapping_op: or
  otlp/logicmonitor:
    endpoint: "host.docker.internal:14317"
    tls:
      insecure: true
extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  pprof: {}
  zpages: {}
service:
  telemetry:
    logs:
      level: warn
  extensions:
  - health_check
  - pprof
  - zpages
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - otlphttp/tempo
      - spanmetrics
      - spanmetrics/lm
    metrics:
      receivers:
      - otlp
      - spanmetrics
      processors:
      - batch
      exporters:
      - prometheus
    logs:
      receivers:
      - otlp
      processors:
      - transform/dockerlogs
      - batch
      exporters:
      - otlphttp/loki
    traces/lm:
      receivers:
      - otlp
      processors:
      - transform/lm_entity
      - batch
      exporters:
      - otlp/logicmonitor
    metrics/lm:
      receivers:
      - otlp
      - spanmetrics/lm
      processors:
      - transform/lm_entity
      - batch/lm
      exporters:
      - otlp/logicmonitor
    logs/lm:
      receivers:
      - otlp
      - loki
      processors:
      - transform/lm_logs
      - batch
      exporters:
      - logicmonitor
