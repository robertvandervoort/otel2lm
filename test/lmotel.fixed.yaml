# generated by otel2lm lmotel-fix from lmotel-config.yaml
receivers:
  hostmetrics:
    collection_interval: 5m
    scrapers:
      cpu: null
      disk: null
      filesystem:
        include_virtual_filesystems: false
        exclude_fs_types:
          fs_types:
          - overlay
          - squashfs
          - tmpfs
          - nsfs
          - proc
          - sysfs
          - cgroup2
          match_type: strict
      memory: null
      network:
        exclude:
          interfaces:
          - ^(veth|br-|docker|cali|flannel|cni).*
          match_type: regexp
  prometheus:
    config:
      scrape_configs:
      - job_name: US-West
        scrape_interval: 5m
        static_configs:
        - targets:
          - "127.0.0.1:8889"
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:14318"
      grpc:
        endpoint: "0.0.0.0:14317"
processors:
  batch:
    send_batch_size: 4000
    send_batch_max_size: 4000
    timeout: 1000ms
  batch/metrics:
    send_batch_size: 300
    send_batch_max_size: 300
    timeout: 5s
  batch/logs:
    send_batch_size: 200
    send_batch_max_size: 200
    timeout: 2s
  memory_limiter:
    check_interval: 60s
    limit_mib: 200
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    policies:
    - name: sample_error_http
      type: numeric_attribute
      numeric_attribute:
        key: http.status_code
        min_value: 300
        max_value: 500
    - name: sample_error_grpc
      type: numeric_attribute
      numeric_attribute:
        key: rpc.grpc.status_code
        min_value: 1
        max_value: 16
exporters:
  lmexporter:
    url: "https://${LOGICMONITOR_ACCOUNT}.logicmonitor.com/rest"
  file:
    path: ./fileout.json
extensions:
  lmextension:
    properties:
      system.categories: lmotel
  health_check:
    endpoint: "127.0.0.1:13134"
service:
  telemetry:
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8889
  extensions:
  - lmextension
  - health_check
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - batch
      exporters:
      - lmexporter
    metrics:
      receivers:
      - prometheus
      - hostmetrics
      - otlp
      processors:
      - batch/metrics
      exporters:
      - lmexporter
    logs:
      receivers:
      - otlp
      processors:
      - batch/logs
      exporters:
      - lmexporter
